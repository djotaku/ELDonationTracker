name: Windows Build

on: [pull_request]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13.3
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Single Executable with Pyinstaller
      shell: pwsh
      run: |
        $qtBin = (python -c "import PySide6, os; print(os.path.join(os.path.dirname(PySide6.__file__), 'Qt6', 'bin'))").Trim()
        Copy-Item -Path @(
          'ffmpeg/avutil-58.dll',
          'ffmpeg/avcodec-60.dll',
          'ffmpeg/swresample-4.dll',
          'ffmpeg/swscale-7.dll',
          'ffmpeg/avformat-60.dll',
          'ffmpeg/libsoxr.dll'
        ) -Destination $qtBin -Force
        pyinstaller -F -p eldonationtracker -n "eldonationtracker" --icon=icon.ico --add-data="icon.png;." eldonationtracker/gui.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4.0.0
      with:
        name: eldonationtracker for Windows
        path: dist/
